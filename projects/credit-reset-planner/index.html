function tierMod(t){
 const c=["Pull all 3 reports; dispute anything wrong, outdated (most negatives drop off after 7 years; bankruptcy after 7 to 10) or not yours.","Freeze your credit files so no new fraud damages you.","Add a budget with automatic payments for every bill; one new late payment hurts most at this stage."];
 const x={good:["Damage is likely limited. Prioritize: bring accounts current, then negotiate hardship plans before anything goes to collections.","Bankruptcy is rarely the right first move here; compare cost of settlement or a nonprofit debt management plan (DMP).","Keep utilization under 30%, ideally 10%, and don't close your oldest cards."],need:["Use a nonprofit credit counselor (NFCC member) for a free review and possible DMP: lower rates, one payment, usually 3 to 5 years.","List debts by rate; attack with avalanche (highest rate) or snowball (smallest balance) after minimums.","Ask each creditor for a hardship program in writing; request goodwill removal of a single late payment once caught up."],bad:["Rank debts: secured (car, home) &gt; taxes/support &gt; everything else. Unsecured card and medical debt is lowest priority legally.","Request debt validation within 30 days of a collector's first notice; many old debts fail validation. Don't acknowledge or pay a very old debt until you check your state's statute of limitations; a payment can restart the clock in many states.","Get a free bankruptcy attorney consult now: if unsecured debt exceeds about 6 months of gross income and you can't pay it down in 3 to 5 years, compare Chapter 7 or 13 to settlement.","Settlements often run 40% to 60% of the balance; forgiven debt can be taxable (IRS Form 1099-C; ask about the insolvency exclusion, Form 982)."],fubar:["Triage with an attorney or legal aid immediately: judgments, garnishments, repossession and tax liens each have different fixes.","Stop the bleeding: confirm exempt income, ask about wage-garnishment exemption forms, and see if filing would automatically stop (stay) garnishment, repossession and most collections.","Check the means test (Chapter 7 vs 13) and gather 6 months of income records.","Do not start credit repair until the legal plan is chosen; new accounts come after, not before."]}[t];
 return ul(c.concat(x));}
function stateMod(st,sn){
 const choice=CH.includes(st),cp=CP.includes(st),ng=NG.includes(st);
 let h=ul([choice?`<b>Exemption choice:</b> ${sn} lets you pick <b>federal</b> or <b>state</b> exemptions (not mixed). Compare both with your attorney and choose the one that protects more of your equity, car, and savings.`:`<b>State exemptions only:</b> ${sn} is an opt-out state, so you must use ${sn}'s exemption list (plus federal non-bankruptcy protections like Social Security and ERISA retirement plans).`,`<b>Homestead (home equity):</b> ${HS[st]||"Amount varies; look up your state's current homestead exemption on the Schedule C instructions or your legal aid site."}`,cp?"<b>Community property state:</b> a spouse's debts and income can matter; ask whether filing jointly or alone is better.":"Not a community property state: filing alone usually protects a non-filing spouse's separate assets, but check joint debts.",ng?`<b>Wage garnishment:</b> ${sn} generally bars garnishment for ordinary consumer debt (exceptions: taxes, support, student loans), which changes how urgent bankruptcy is.`:"<b>Wage garnishment:</b> federal cap is 25% of disposable earnings (or less if low income); some states cut that further.","<b>Statute of limitations:</b> varies by state and debt type (about 3 to 10 years). Time-barred debts can't win a lawsuit but still show on reports until 7 years from first delinquency.","<b>Residency rule:</b> to use a state's exemptions you must generally have lived there 730 days before filing; otherwise the earlier state's rules may apply."]);
 return h+`<div class="warn"><b>Federal figures (cases filed Apr 1, 2025 to Mar 31, 2028):</b> homestead $31,575 ($63,150 joint), vehicle $5,025, and a $214,000 cap on equity added in the last 1,215 days even in unlimited-homestead states. Median-income limits for the means test update every April 1; check the link in section 7 for ${sn}.</div>`;}
function incMod(i){
 const common=["Means test uses your <b>average gross income for the 6 full months before filing</b>, compared to your state's median for your household size.","Chapter 7 filing fee is about $338 and Chapter 13 about $313 (confirm at uscourts.gov); fee waiver or installments may be available if income is low."];
 const m={w2f:["Keep the last 6 months of pay stubs, 2 years of tax returns, and W-2s.","If over the median, expect the full means test; Chapter 13 may be required.","Retirement plans like 401(k) are generally protected; don't cash them to pay unsecured debt."],w2p:["Document every hour and second job; add up all income.","Low income often means Chapter 7 qualifies, and a fee waiver is possible. Ask about it.","If hours are unstable, a Chapter 13 plan must still be affordable; pick a lawyer who will model your worst month."],c1099:["Means test income is gross receipts <b>minus ordinary business expenses</b>: keep a clean 6-month profit-and-loss and receipts.","Separate business and personal accounts now; commingling invites trustee questions.","File every missing tax return (Chapter 13 requires the last 4 years). Recent income-tax debt may survive bankruptcy; payment plans (IRS Form 9465) are an alternative.","Set aside quarterly estimated taxes so the restart doesn't create a new tax debt."],cash:["Bankruptcy forms are signed under penalty of perjury: all income must be disclosed, including cash.","Start now: deposit cash income into a bank account, keep a simple log with dates and amounts, and file taxes going forward. Speak to an attorney (and a tax pro) about past unreported income before filing; do not hide it.","Banks and lenders can't see cash income, so documenting it is also how you'll qualify for credit and loans later."],ui:["Unemployment benefits go on Schedule I and into the 6-month means-test average. Most courts count them; some exclude them as Social Security Act benefits, so ask your attorney how your district rules.","The 6-month lookback also includes wages from before the layoff, which can put you over the median even if you earn little now. Explain the job loss; ask about special circumstances or timing the filing.","Benefits already paid are generally protected from most creditors; keep them in their own account so they stay traceable.","Documents: award letter, payment history (1099-G), separation letter, job-search log, pay stubs from the 6 months before the layoff.","Chapter 13 needs steady income and benefits end, so Chapter 7 or negotiation is usually the realistic path until you are re-employed. Report any new job right away.","Lenders rarely count unemployment as income: use secured cards and credit-builder loans that need little income."],un:["With no income, the means test is usually easy to pass, but it still looks back 6 months at past earnings.","You may be judgment-proof (creditors can't take exempt or no income). Don't pay or acknowledge old debts out of guilt; a payment can restart the statute of limitations.","Chapter 13 isn't feasible without income. Ask about the fee waiver (income under 150% of poverty) and free help via legal aid.","Apply for unemployment, SNAP, Medicaid and utility aid now: it cuts expenses and documents your situation.","Don't charge living costs or cash advances right before filing; recent charges can be ruled non-dischargeable.","Documents: pay stubs from before the job loss, termination letter, denial letters, job-search proof."],none:["Income of Social Security, SSI, SSDI, VA and most public benefits is generally protected from creditors and garnishment.","Debts may be 'judgment proof': check whether bankruptcy is even needed. Never agree to pay a collector if you can't; it can restart the debt's clock.","Ask about Chapter 7 fee waiver; legal aid and Upsolve.org help qualifying low-income filers file free."]}[i];
 return ul(common.concat(m));}
function homeMod(h){return ul({rent:["Landlords care about recent rent history more than a bankruptcy line: gather payment records, a short explanation letter, a larger deposit, or a co-signer.","Get 12 months of on-time rent reported to bureaus via a rent-reporting service.","Don't sign a lease with a no-credit-check 'rent-to-own' trap; read fees."],own:["Compare your equity to the exemption in section 2. If equity is above it, Chapter 7 can put the home at risk; Chapter 13 lets you keep it by paying the non-exempt amount over the plan.","Chapter 7 does not remove a mortgage lien; you keep the home by staying current.","Do not refinance or take new liens right before filing; it can complicate exemptions."],behind:["Act fast: ask your servicer for loss mitigation (forbearance, repayment plan, modification) and call a HUD-approved housing counselor (888-995-HOPE).","Chapter 13 can stop foreclosure and let you catch up arrears over 3 to 5 years; Chapter 7 only delays it.","Learn your state's foreclosure timeline (judicial or non-judicial) and any state homeowner aid program."]}[h]);}
function goalMod(g,t){
 if(g=="fix")return ol(["Dispute errors and send validation letters within 30 days of collector contact.","Call each creditor: ask for hardship plan, lower rate, or settlement; get terms in writing BEFORE paying.","Try a nonprofit DMP (NFCC) if you can pay 100% over time; it usually shuts off interest.","Settle the smallest, oldest, or most threatening debts first; negotiate lump sums; pay by traceable method.","Request pay-for-delete or goodwill removal after settling (not guaranteed; get it in writing).","Build in parallel: secured card or credit-builder loan, on-time payments, utilization under 30%.","Set a bankruptcy trigger: if debt is more than you can repay in 3 to 5 years, or a garnishment/foreclosure looms, switch to the filing plan."]);
 if(g=="file")return ol(["<b>Choose attorney or free route:</b> most offer free consults; flat fees are common. Qualifying low-income filers can use legal aid or Upsolve.org. Avoid unregulated 'document preparers'.","<b>Chapter 7 vs 13:</b> Chapter 7 (liquidation) wipes most unsecured debt in about 3 to 4 months if you pass the means test; Chapter 13 (3 to 5 year plan) keeps assets, stops foreclosure and repays part of debt.","Complete the required credit counseling course from an approved provider within 180 days before filing.","Gather: tax returns (2 years), pay stubs (6 months), bank statements, debt list with addresses, deeds, titles, retirement statements.","<b>Before filing, don't:</b> run up cards, pay back friends/family, transfer or sell property cheaply, or take cash advances.","File petition and schedules. The <b>automatic stay</b> usually halts collections, garnishments, and most lawsuits immediately.","Attend the 341 meeting (about 30 to 45 days later). Decide on car: reaffirm, redeem or surrender.","Take the post-filing debtor-education course; discharge typically arrives about 60 to 90 days after the 341 meeting in Chapter 7.","Re-filing waits: Chapter 7 after 7: 8 years; Chapter 13 after 7: 4 years; 7 after 13: 6 years (mostly); 13 after 13: 2 years. Confirm with counsel."]);
 return ol(["Within a week of discharge: pull all 3 reports; every discharged account should show $0 balance 'included in bankruptcy'; dispute errors in writing.","Months 0 to 3: secured card plus credit-builder loan; autopay; keep usage under 10%.","Months 3 to 12: add an unsecured card from a credit union; check scores climbing; consider a modest car loan with a fair APR.","Mortgage waiting periods (rule-of-thumb, confirm with lender): FHA 2 years after Chapter 7 discharge, 1 year into a Chapter 13 plan with court approval; VA 2 years; USDA 3 years; conventional 4 years after Chapter 7 or 2 after Chapter 13 discharge.","Credit reports: Chapter 7 can remain up to 10 years, Chapter 13 up to 7, but impact fades quickly with new positive history.","Save: 3 to 6 months of expenses; lenders and landlords see reserves as proof the reset worked.","Avoid post-bankruptcy 'guaranteed' high-fee cards and buy-here-pay-here lots; rebuild with reporting accounts from banks and credit unions.","Then use the Credit &amp; Funding Playbook ladder: business entity, bank relationship, net-30, microloan/CDFI, line of credit, SBA."]);}

const EM={en:["<b>Sued or served papers?</b> Respond before the deadline (often 20 to 30 days; check the summons). A default judgment is what leads to garnishment and bank levies.","<b>Garnishment or levy hitting?</b> Federal law generally caps wage garnishment at 25% of disposable pay; Social Security, SSI, VA and most benefits are protected. Tell your bank in writing if exempt funds are frozen.","<b>Protect the essentials first:</b> housing, utilities, transportation, food, then income. Pay secured and essential bills before cards and collections.","Never give a collector bank or card access. Pay by money order or one-time payment after written validation.","Avoid anyone who charges upfront to settle debt, repair credit or 'file for you'; those upfront fees are banned."],
es:["<b>¿Te demandaron o recibiste citatorio?</b> Responde antes del plazo (a menudo 20 a 30 días; revisa la citación). Una sentencia en rebeldía lleva a embargos de salario y de cuentas bancarias.","<b>¿Te embargan el salario o la cuenta?</b> La ley federal generalmente limita el embargo salarial al 25% del ingreso disponible; el Seguro Social, SSI, VA y la mayoría de los beneficios están protegidos. Avisa por escrito a tu banco si congelaron fondos exentos.","<b>Protege primero lo esencial:</b> vivienda, servicios, transporte, comida y luego ingresos. Paga las deudas garantizadas y esenciales antes que tarjetas y cobranzas.","Nunca des acceso a tu cuenta o tarjeta a un cobrador. Paga con money order o con un pago único, después de recibir la validación por escrito.","Evita a quien cobre por adelantado para negociar deudas, reparar crédito o «presentar por ti»; esos cobros por adelantado están prohibidos."],
ru:["<b>Вас засудили или вручили повестку?</b> Ответьте до крайнего срока (часто 20–30 дней; смотрите повестку). Заочное решение суда приводит к удержаниям из зарплаты и аресту банковского счёта.","<b>Удерживают зарплату или арестовали счёт?</b> Федеральный закон обычно ограничивает удержание 25% располагаемого дохода; Social Security, SSI, VA и большинство пособий защищены. Если заморозили защищённые средства, напишите в банк.","<b>Сначала защитите главное:</b> жильё, коммунальные услуги, транспорт, еду, затем доход. Платите по обеспеченным и жизненно важным счетам раньше, чем по картам и коллекторам.","Никогда не давайте коллектору доступ к счёту или карте. Платите денежным переводом или разовым платежом после письменного подтверждения долга.","Остерегайтесь тех, кто берёт предоплату за урегулирование долгов, исправление кредита или «подачу за вас»; такая предоплата запрещена."]};
const CI={en:"<b>What it is:</b> a one-time budget and credit counseling briefing from a nonprofit agency approved by the U.S. Trustee Program (11 U.S.C. 109(h)). It is separate from the debtor-education course you take later.",es:"<b>Qué es:</b> una sesión única de asesoría de presupuesto y crédito con una agencia sin fines de lucro aprobada por el Programa del Fideicomisario de EE. UU. (11 U.S.C. 109(h)). Es distinta del curso de educación para el deudor que tomas después.",ru:"<b>Что это:</b> одноразовая консультация по бюджету и кредиту в некоммерческой организации, одобренной программой U.S. Trustee (11 U.S.C. 109(h)). Это отдельно от курса финансовой грамотности, который проходят позже."};
const CB={en:["<b>When it started:</b> required by the Bankruptcy Abuse Prevention and Consumer Protection Act of 2005, for cases filed on or after Oct 17, 2005.","<b>Why it matters:</b> without a certificate dated within the 180 days before you file, you generally aren't eligible to file and the case can be dismissed (losing the filing fee and the automatic stay).","<b>What it does for you:</b> reviews your income, expenses and debts, explains alternatives (budget changes, creditor negotiation, a debt management plan, bankruptcy), and may produce a written plan. You're never obligated to accept it.","<b>How hard:</b> easy. No test and no pass/fail; you just complete it. Typically 60 to 90 minutes (sometimes up to 2 hours) online, by phone or in person, with a certificate emailed afterward.","<b>Cost:</b> commonly about $10 to $50; agencies must offer it free or reduced if you can't pay, so say so. Each spouse in a joint case needs a certificate.","<b>Pick the provider carefully:</b> use only agencies on the official approved list (US Trustee Program; in Alabama and North Carolina the bankruptcy administrator's list). Verify before paying; unapproved certificates are rejected.","<b>Timing:</b> do it after you decide to file but not more than 180 days (about 6 months) before the petition. Your attorney normally files the certificate.","<b>Exceptions:</b> emergencies (you must still complete it within 30 days after filing, with court approval), serious incapacity or disability, active military duty in a combat zone, or districts without available agencies.","<b>Second course:</b> after filing you complete a debtor-education (financial management) course; it is required before discharge, usually due within 60 days of the first creditors' meeting in Chapter 7."],
es:["<b>Cuándo empezó:</b> lo exige la Ley de Prevención del Abuso de la Quiebra y Protección del Consumidor de 2005, para casos presentados desde el 17 de octubre de 2005.","<b>Por qué importa:</b> sin un certificado fechado dentro de los 180 días anteriores a presentar, por lo general no puedes presentar y el caso puede ser desestimado (pierdes la tarifa y la suspensión automática).","<b>Qué hace por ti:</b> revisa tus ingresos, gastos y deudas, explica alternativas (ajustar el presupuesto, negociar con acreedores, un plan de administración de deudas, la quiebra) y puede generar un plan por escrito. No estás obligado a aceptarlo.","<b>Qué tan difícil es:</b> fácil. No hay examen ni se aprueba o reprueba; solo lo completas. Normalmente 60 a 90 minutos (a veces hasta 2 horas), en línea, por teléfono o en persona; el certificado llega por correo electrónico.","<b>Costo:</b> normalmente de $10 a $50 aproximadamente; las agencias deben ofrecerlo gratis o con descuento si no puedes pagar, así que dilo. En un caso conjunto, cada cónyuge necesita su certificado.","<b>Elige bien al proveedor:</b> usa solo agencias de la lista oficial aprobada (Programa del Fideicomisario de EE. UU.; en Alabama y Carolina del Norte, la lista del administrador de quiebras). Verifica antes de pagar; los certificados de agencias no aprobadas se rechazan.","<b>Momento:</b> hazlo cuando decidas presentar, pero no más de 180 días (unos 6 meses) antes de la petición. Normalmente tu abogado presenta el certificado.","<b>Excepciones:</b> emergencias (aun así debes completarlo dentro de los 30 días posteriores a presentar, con aprobación del tribunal), incapacidad o discapacidad grave, servicio militar activo en zona de combate, o distritos sin agencias disponibles.","<b>Segundo curso:</b> después de presentar, tomas un curso de educación para el deudor (manejo financiero); es obligatorio antes del descargo, normalmente dentro de los 60 días de la primera reunión de acreedores en el Capítulo 7."],
ru:["<b>Когда появился:</b> требование введено законом о предотвращении злоупотреблений банкротством и защите потребителей 2005 года, для дел, поданных с 17 октября 2005 года.","<b>Почему важно:</b> без сертификата, датированного не ранее чем за 180 дней до подачи, подать на банкротство, как правило, нельзя, а дело могут прекратить (вы потеряете пошлину и автоматическую защиту, automatic stay).","<b>Что это даёт вам:</b> разбор доходов, расходов и долгов, обзор альтернатив (корректировка бюджета, переговоры с кредиторами, план управления долгами, банкротство) и, возможно, письменный план. Принимать его не обязаны.","<b>Насколько сложно:</b> легко. Экзамена и «сдал/не сдал» нет, нужно просто пройти. Обычно 60–90 минут (иногда до 2 часов) онлайн, по телефону или очно; сертификат приходит на email.","<b>Стоимость:</b> обычно около $10–$50; если вы не можете заплатить, организация обязана предоставить услугу бесплатно или со скидкой, так что скажите об этом. При совместной подаче сертификат нужен каждому супругу.","<b>Выбирайте провайдера внимательно:</b> только из официального списка одобренных организаций (U.S. Trustee Program; в Алабаме и Северной Каролине список администратора по банкротствам). Проверьте до оплаты: сертификаты неодобренных организаций не принимают.","<b>Сроки:</b> проходите, когда решили подавать, но не раньше чем за 180 дней (около 6 месяцев) до подачи петиции. Сертификат обычно подаёт ваш адвокат.","<b>Исключения:</b> экстренные случаи (всё равно нужно пройти в течение 30 дней после подачи, с одобрения суда), тяжёлая недееспособность или инвалидность, активная военная служба в зоне боевых действий, округа без доступных организаций.","<b>Второй курс:</b> после подачи вы проходите курс финансовой грамотности (debtor education); он обязателен до списания долгов, обычно в течение 60 дней после первого собрания кредиторов по Главе 7."]};

const IR={u10:{en:"Under $10k: set up an online payment plan this week.",es:"Menos de $10k: configura un plan de pago en línea esta semana.",ru:"Менее $10 тыс.: оформите онлайн план платежей на этой неделе."},m50:{en:"$10k to $50k: you can still apply online for an installment agreement; compare it to a lower-rate loan that pays the IRS off.",es:"$10k a $50k: aún puedes solicitar en línea un acuerdo a plazos; compáralo con un préstamo de menor tasa que pague al IRS.",ru:"$10–50 тыс.: можно подать онлайн заявку на рассрочку; сравните с кредитом под меньший процент, которым можно погасить долг перед IRS."},o50:{en:"Over $50k: get a CPA, enrolled agent or tax attorney before any filing; large balances bring liens and levies and need Form 433-F/433-A details.",es:"Más de $50k: consigue un CPA, agente inscrito o abogado tributario antes de cualquier trámite; los saldos grandes traen gravámenes y embargos y requieren detalles del Formulario 433-F/433-A.",ru:"Более $50 тыс.: до любых шагов обратитесь к CPA, enrolled agent или налоговому адвокату; крупные долги влекут залоги и аресты и требуют данных по формам 433-F/433-A."},unk:{en:"Not sure: log in at irs.gov/account to see balances and get transcripts; then file every missing return.",es:"No estás seguro: entra a irs.gov/account para ver saldos y obtener transcripciones; luego presenta todas las declaraciones faltantes.",ru:"Не уверены: зайдите на irs.gov/account, посмотрите остатки и получите выписки; затем подайте все недостающие декларации."}};
const IB={en:["<b>File every return first.</b> Failure-to-file is 5% per month (max 25%) versus 0.5% per month for failure-to-pay, and Chapter 13 and most IRS deals require filed returns.","<b>Pay options:</b> short-term plan (up to 180 days), installment agreement (monthly), Offer in Compromise if you can never pay in full, Currently Not Collectible for true hardship, and first-time penalty abatement.","<b>Bankruptcy:</b> income-tax debt is dischargeable in Chapter 7 only if the return was due 3+ years ago, filed 2+ years ago, assessed 240+ days ago, and no fraud. Otherwise it survives; Chapter 13 can bundle priority taxes into one 3 to 5 year plan. Tax liens on property survive either way. Payroll (trust-fund) taxes are never dischargeable.","<b>Respond to every notice.</b> Letters like CP504, LT11 and 1058 start a 30-day window to request a Collection Due Process hearing before a levy.","<b>Stuck or facing hardship:</b> Taxpayer Advocate Service, 877-777-4778 (Form 911). Avoid 'tax relief' companies that charge big upfront fees.","State tax debt follows similar rules; check your state revenue department.","Use the IRS payment plan calculator."],
es:["<b>Presenta primero todas las declaraciones.</b> La multa por no presentar es 5% al mes (máximo 25%) frente a 0.5% al mes por no pagar; el Capítulo 13 y la mayoría de los acuerdos con el IRS exigen declaraciones presentadas.","<b>Opciones de pago:</b> plan a corto plazo (hasta 180 días), acuerdo a plazos (mensual), Oferta de Compromiso si nunca podrás pagar todo, «No Cobrable por Ahora» por dificultad real y condonación de multas por primera vez.","<b>Quiebra:</b> la deuda de impuesto sobre la renta se descarga en el Capítulo 7 solo si la declaración venció hace 3+ años, se presentó hace 2+ años, se evaluó hace 240+ días y no hubo fraude. Si no, sobrevive; el Capítulo 13 puede agrupar impuestos prioritarios en un plan de 3 a 5 años. Los gravámenes sobre bienes sobreviven en ambos casos. Los impuestos de nómina nunca se descargan.","<b>Responde a cada aviso.</b> Cartas como CP504, LT11 y 1058 abren 30 días para pedir una audiencia de Debido Proceso de Cobro antes de un embargo.","<b>Si estás atascado:</b> Defensor del Contribuyente (TAS), 877-777-4778 (Formulario 911). Evita compañías de «alivio de impuestos» que cobran mucho por adelantado.","La deuda de impuestos estatales sigue reglas similares; consulta el departamento de ingresos de tu estado.","Usa la calculadora del plan de pago del IRS."],
ru:["<b>Сначала подайте все декларации.</b> Штраф за неподачу 5% в месяц (максимум 25%) против 0,5% в месяц за неуплату; для Главы 13 и большинства соглашений с IRS декларации должны быть поданы.","<b>Варианты оплаты:</b> краткосрочный план (до 180 дней), рассрочка (ежемесячно), Offer in Compromise, если вы никогда не сможете выплатить всё, «Currently Not Collectible» при реальных трудностях и первичное списание штрафов.","<b>Банкротство:</b> подоходный налог списывается по Главе 7, только если срок подачи декларации был 3+ года назад, она подана 2+ года назад, налог начислен 240+ дней назад и не было мошенничества. Иначе долг остаётся; Глава 13 может объединить приоритетные налоги в один план на 3–5 лет. Налоговые залоги на имущество сохраняются в обоих случаях. Налоги с фонда оплаты труда не списываются никогда.","<b>Отвечайте на каждое уведомление.</b> Письма вроде CP504, LT11 и 1058 дают 30 дней, чтобы запросить слушание Collection Due Process до ареста имущества.","<b>Если нужна помощь:</b> Taxpayer Advocate Service, 877-777-4778 (форма 911). Избегайте компаний «налогового списания» с крупной предоплатой.","Долги по налогам штата подчиняются похожим правилам; уточните в налоговом ведомстве штата.","Используйте калькулятор плана выплат IRS."]};
function irsMod(k){return ul([IR[k][lang]].concat(IB[lang]))}
const CT={debt:{es:["Calculadora de pago de deudas y acuerdos","Muestra cuánto tarda en pagarse cada deuda con el método bola de nieve (menor saldo primero) o avalancha (mayor tasa primero), cuánto interés pagarás y cuánto podría ahorrar un acuerdo de pago único."],ru:["Калькулятор погашения долгов и урегулирования","Показывает, за сколько вы погасите каждый долг методом снежного кома (сначала малый остаток) или лавины (сначала высокая ставка), сколько заплатите процентов и сколько может сэкономить разовое урегулирование."]},
budget:{es:["Hoja de presupuesto mensual y excedente","Suma tus ingresos netos y gastos esenciales para mostrar tu excedente o déficit real, el número que piden prestamistas, consejeros y tribunales."],ru:["Таблица месячного бюджета и остатка","Складывает ваш доход после налогов и обязательные расходы, показывая реальный остаток или дефицит, цифру, которую запрашивают кредиторы, консультанты и суды."]},
