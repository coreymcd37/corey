  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020204;
      color: #f3f4f6;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .prism-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 1280px;
      max-height: 800px;
      background: #050508;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(79, 70, 229, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }

    .prism-canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }

    .prism-hud {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .prism-brand h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin: 0 0 4px 0;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .prism-brand p {
      font-size: 0.7rem;
      color: #9ca3af;
      letter-spacing: 0.1em;
      margin: 0;
    }

    .hud-right {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      pointer-events: auto;
    }

    .prism-stats {
      text-align: right;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: #9ca3af;
      background: rgba(12, 12, 20, 0.7);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .prism-stats span {
      color: #818cf8;

    .hud-btn {
      background: rgba(12, 12, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }

    .hud-btn:hover {
      background: rgba(129, 140, 248, 0.2);
      border-color: #818cf8;
      color: #fff;
    }

    .hud-btn.active {
      background: rgba(129, 140, 248, 0.35);
      border-color: #c084fc;
      box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
    }

    .prism-console {
      background: rgba(12, 12, 20, 0.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
    }

    .console-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .console-input-row {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .console-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .console-input:focus {
      border-color: #818cf8;
      background: rgba(129, 140, 248, 0.06);
      box-shadow: 0 0 25px rgba(129, 140, 248, 0.2);
    }

    .console-btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 12px;
      color: white;
      padding: 0 24px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .console-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
    }

    .console-btn:active {
      transform: translateY(0);
    }

    .console-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .console-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6b7280;
      margin-right: 4px;

    .prism-tag {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .prism-tag:hover {
      background: rgba(129, 140, 248, 0.12);
      border-color: rgba(129, 140, 248, 0.35);
      color: #c7d2fe;
    }

    .synth-presets {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .synth-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #9ca3af;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .synth-btn:hover {
      border-color: #a855f7;
      color: #e2e8f0;
    }

    .synth-btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: #c084fc;
      color: #f3e8ff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    @media (max-width: 768px) {
      .prism-wrapper {
        width: 100vw;
        height: 100vh;
        max-height: none;
        border-radius: 0;
      }
      .console-top-row {
        flex-direction: column;
      }
      .console-input-row {
        width: 100%;
      }
      .console-btn {
        width: 100%;
        padding: 12px;
      }
      .hud-right {
        flex-direction: column;
        gap: 8px;
      }
    }
  </style>

<body>
<a class="cmd-back" href="/home/#projects">&larr; Life Project Files</a>

  <div class="prism-wrapper">
    <div class="prism-hud">
      <div class="prism-brand">
        <h1>Cognitive Prism</h1>
        <p>Synesthetic Thought Matrix</p>
      </div>
      <div class="hud-right">
        <button id="quantumDistortBtn" class="hud-btn">Quantum Warp: Off</button>
        <button id="exportSnapshotBtn" class="hud-btn">Export Wallpaper</button>
        <div class="prism-stats">
          <div>Resonance: <span id="stat-res">432</span> Hz</div>
          <div>Crystals: <span id="stat-nodes">0</span></div>
        </div>
      </div>
    </div>

    <div class="prism-canvas-container">
      <canvas id="prismCanvas"></canvas>
    </div>

    <div class="prism-console">
      <div class="console-top-row">
        <div class="console-input-row">
          <input type="text" id="thoughtInput" class="console-input" placeholder="Type a thought, concept, or emotion to materialize (Double-click canvas for shockwaves)..." autocomplete="off" />
          <button id="materializeBtn" class="console-btn">Materialize</button>
        </div>
      </div>

      <div class="console-bottom-row">
        <div class="console-tags">
          <span class="tag-label">Catalysts:</span>
          <button class="prism-tag" data-val="Serenity">Serenity</button>
          <button class="prism-tag" data-val="Chaos">Chaos</button>
          <button class="prism-tag" data-val="Eternity">Eternity</button>
          <button class="prism-tag" data-val="Quantum Void">Quantum Void</button>
          <button class="prism-tag" data-val="Bioluminescence">Bioluminescence</button>
        </div>

        <div class="synth-presets">
          <span class="tag-label">Synthesizer:</span>
          <button class="synth-btn" data-preset="off">Off</button>
          <button class="synth-btn" data-preset="ambient">Ambient</button>
          <button class="synth-btn" data-preset="solfeggio">528Hz Solfeggio</button>
          <button class="synth-btn" data-preset="cybernetic">Cybernetic</button>
          <button class="synth-btn" data-preset="cosmic">Cosmic Drone</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('prismCanvas');
      const ctx = canvas.getContext('2d');
      const inputEl = document.getElementById('thoughtInput');
      const btnEl = document.getElementById('materializeBtn');
      const statNodes = document.getElementById('stat-nodes');
      const statRes = document.getElementById('stat-res');
      const quantumBtn = document.getElementById('quantumDistortBtn');
      const exportBtn = document.getElementById('exportSnapshotBtn');

      let width, height;
      let nodes = [];
      let particles = [];
      let shockwaves = [];
      let globalRotation = 0;
      let isQuantumWarpActive = false;
      
      // Web Audio state
      let audioCtx = null;
      let synthGain = null;
      let activeOscillators = [];
      let currentSynthPreset = 'off';

      function resize() {
        width = canvas.width = canvas.offsetWidth;
        height = canvas.height = canvas.offsetHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      function initAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function playChime(freq) {
        try {
          initAudioContext();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2.5);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + 2.5);
        } catch(e) {}
      }

      // Continuous Generative Harmonic Synthesizer
      function setSynthPreset(presetName) {
        initAudioContext();
        currentSynthPreset = presetName;

        // Stop existing ambient oscillators
        activeOscillators.forEach(o => {
          try { o.stop(); } catch(e) {}
        });
        activeOscillators = [];
        if (synthGain) {
          try { synthGain.disconnect(); } catch(e) {}
        }

        document.querySelectorAll('.synth-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.querySelector(`.synth-btn[data-preset="${presetName}"]`);
        if (activeBtn) activeBtn.classList.add('active');

        if (presetName === 'off') return;

        synthGain = audioCtx.createGain();
        synthGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        synthGain.connect(audioCtx.destination);

        let frequencies = [110, 164.81, 220, 329.63]; // Default ambient chord
        if (presetName === 'solfeggio') {
          frequencies = [174, 285, 396, 528];
        } else if (presetName === 'cybernetic') {
          frequencies = [130.81, 196, 261.63, 392];
        } else if (presetName === 'cosmic') {
          frequencies = [73.42, 110, 146.83, 220];
        }

        frequencies.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          osc.type = (idx % 2 === 0) ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          
          // Subtle LFO modulation effect simulation
          osc.connect(synthGain);
          osc.start();
          activeOscillators.push(osc);
        });
      }

      document.querySelectorAll('.synth-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setSynthPreset(btn.getAttribute('data-preset'));
        });
      });

      class CrystalNode {
        constructor(text, x, y) {
          this.text = text;
          this.x = x || (width / 2 + (Math.random() - 0.5) * 350);
          this.y = y || (height / 2 + (Math.random() - 0.5) * 220);
          this.vx = (Math.random() - 0.5) * 1.0;
          this.vy = (Math.random() - 0.5) * 1.0;
          this.size = Math.max(55, text.length * 9 + 30);
          this.sides = Math.min(8, Math.max(3, Math.floor(text.length % 6) + 3));
          this.hue = Math.floor(Math.random() * 360);
          this.freq = 150 + (this.hue / 360) * 600;
          this.pulse = Math.random() * Math.PI;
          
          for (let i = 0; i < 24; i++) {
            particles.push(new Particle(this.x, this.y, this.hue));
          }

          playChime(this.freq);
          statRes.textContent = Math.round(this.freq);
        }

        update() {
          if (isQuantumWarpActive) {
            // Quantum vortex distortion pull towards center with swirl
            let cx = width / 2;
            let cy = height / 2;
            let dx = cx - this.x;
            let dy = cy - this.y;
            let dist = Math.hypot(dx, dy) + 1;
            let angle = Math.atan2(dy, dx) + 0.05; // rotational torque
            
            this.vx += Math.cos(angle) * (150 / dist);
            this.vy += Math.sin(angle) * (150 / dist);
          }

          this.x += this.vx;
          this.y += this.vy;

          this.vx *= 0.98;
          this.vy *= 0.98;

          if (this.x < 90 || this.x > width - 90) this.vx *= -1;
          if (this.y < 90 || this.y > height - 90) this.vy *= -1;

          this.pulse += 0.035;
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(globalRotation * 0.5 + Math.sin(this.pulse) * 0.12);

          let currentSize = this.size + Math.sin(this.pulse) * 8;

          let gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, currentSize);
          gradient.addColorStop(0, `hsla(${this.hue}, 85%, 65%, 0.3)`);
          gradient.addColorStop(1, `hsla(${this.hue}, 85%, 65%, 0)`);
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(0, 0, currentSize * 1.6, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          for (let i = 0; i < this.sides; i++) {
            let angle = (i * 2 * Math.PI) / this.sides;
            let px = Math.cos(angle) * currentSize;
            let py = Math.sin(angle) * currentSize;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          
          ctx.strokeStyle = `hsl(${this.hue}, 90%, 75%)`;
          ctx.lineWidth = isQuantumWarpActive ? 2.5 : 1.5;
          ctx.shadowBlur = 18;
          ctx.shadowColor = `hsl(${this.hue}, 90%, 75%)`;
          ctx.stroke();

          ctx.fillStyle = `hsla(${this.hue}, 70%, 15%, 0.45)`;
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.rotate(-(globalRotation * 0.5 + Math.sin(this.pulse) * 0.12));
          ctx.fillStyle = '#ffffff';
          ctx.font = '500 11px "Space Grotesk", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.text.toUpperCase(), 0, 0);

          ctx.restore();
        }
      }

      class Particle {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          let angle = Math.random() * Math.PI * 2;
          let speed = Math.random() * 3.5 + 1;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.hue = hue;
          this.alpha = 1.0;
          this.decay = Math.random() * 0.012 + 0.004;
          this.radius = Math.random() * 2.2 + 1;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= this.decay;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = Math.max(0, this.alpha);
          ctx.fillStyle = `hsl(${this.hue}, 100%, 75%)`;
          ctx.shadowBlur = 10;
          ctx.shadowColor = `hsl(${this.hue}, 100%, 75%)`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      class Shockwave {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.radius = 10;
          this.maxRadius = Math.max(width, height) * 0.75;
          this.alpha = 1.0;
        }

        update() {
          this.radius += 12;
          this.alpha = Math.max(0, 1.0 - (this.radius / this.maxRadius));
        }

        draw() {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(192, 132, 252, ${this.alpha * 0.8})`;
          ctx.lineWidth = 2.5;
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#c084fc';
          ctx.stroke();
          ctx.restore();
        }
      }

      nodes.push(new CrystalNode("Consciousness", width / 2 - 140, height / 2 - 50));
      nodes.push(new CrystalNode("Synthesis", width / 2 + 140, height / 2 + 50));

      function materializeThought(text) {
        if (!text || text.trim() === "") return;
        nodes.push(new CrystalNode(text.trim()));
        inputEl.value = "";
        statNodes.textContent = nodes.length;
        if(nodes.length > 10) nodes.shift();
      }

      btnEl.addEventListener('click', () => materializeThought(inputEl.value));
      inputEl.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') materializeThought(inputEl.value);
      });

      document.querySelectorAll('.prism-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          materializeThought(tag.getAttribute('data-val'));
        });
      });

      // Quantum Field Distortion Mode Toggle
      quantumBtn.addEventListener('click', () => {
        isQuantumWarpActive = !isQuantumWarpActive;
        if (isQuantumWarpActive) {
          quantumBtn.textContent = 'Quantum Warp: Active';
          quantumBtn.classList.add('active');
          playChime(660);
        } else {
          quantumBtn.textContent = 'Quantum Warp: Off';
          quantumBtn.classList.remove('active');
          playChime(220);
        }
      });

      // Export Snapshot as Glowing Wallpaper PNG
      exportBtn.addEventListener('click', () => {
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'Cognitive-Prism-Wallpaper.png';
        link.href = dataURL;
        link.click();
        playChime(880);
      });

      // Double-click Shockwave trigger
      canvas.addEventListener('dblclick', (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        shockwaves.push(new Shockwave(x, y));
        playChime(523.25); // C5 note

        // Push nearby nodes away from shockwave epicenter
        nodes.forEach(node => {
          let dx = node.x - x;
          let dy = node.y - y;
          let dist = Math.hypot(dx, dy) + 1;
          if (dist < 300) {
            let force = (300 - dist) * 0.3;
            node.vx += (dx / dist) * force;
            node.vy += (dy / dist) * force;
          }
        });

        // Spawn radiant spark particles
        for (let i = 0; i < 35; i++) {
          particles.push(new Particle(x, y, Math.random() * 360));
        }
      });

      // Crystal Drag Physics
      let isDragging = false;
      let dragTarget = null;

      canvas.addEventListener('mousedown', (e) => {
        if (e.detail > 1) return; // ignore double clicks
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        for (let node of nodes) {
          let dist = Math.hypot(node.x - mx, node.y - my);
          if (dist < node.size) {
            isDragging = true;
            dragTarget = node;
            break;
          }
        }
      });

      canvas.addEventListener('mousemove', (e) => {
        if (isDragging && dragTarget) {
          const rect = canvas.getBoundingClientRect();
          dragTarget.x = e.clientX - rect.left;
          dragTarget.y = e.clientY - rect.top;
        }
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
        dragTarget = null;
      });

      function animate() {
        ctx.fillStyle = 'rgba(5, 5, 8, 0.28)';
        ctx.fillRect(0, 0, width, height);

        globalRotation += isQuantumWarpActive ? 0.008 : 0.003;

        // Render connecting webs with warp curvature if active
        ctx.lineWidth = isQuantumWarpActive ? 1.2 : 0.75;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            let dx = nodes[i].x - nodes[j].x;
            let dy = nodes[i].y - nodes[j].y;
            let dist = Math.hypot(dx, dy);

            if (dist < 380) {
              ctx.strokeStyle = `hsla(${(nodes[i].hue + nodes[j].hue) / 2}, 75%, 75%, ${(1 - dist / 380) * 0.35})`;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              if (isQuantumWarpActive) {
                // Curved quadratic bezier warp
                let midX = (nodes[i].x + nodes[j].x) / 2 + Math.sin(globalRotation * 3) * 40;
                let midY = (nodes[i].y + nodes[j].y) / 2 + Math.cos(globalRotation * 3) * 40;
                ctx.quadraticCurveTo(midX, midY, nodes[j].x, nodes[j].y);
              } else {
                ctx.lineTo(nodes[j].x, nodes[j].y);
              }
              ctx.stroke();
            }
          }
        }

        // Update & Draw Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          shockwaves[i].update();
          shockwaves[i].draw();
          if (shockwaves[i].alpha <= 0) {
            shockwaves.splice(i, 1);
          }
        }

        // Update & Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
          }
        }

        // Update & Draw Nodes
        for (let node of nodes) {
          node.update();
          node.draw();
        }

        statNodes.textContent = nodes.length;
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
</html>
